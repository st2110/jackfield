schema: spec-driven

# Project context — shown to the AI when creating any artifact.
# HARD LIMIT: 50KB. Above it openspec drops the whole `context` field with a
# console warning, and artifacts get generated with no project context at all.
context: |
  Project: jackfield — an NMOS controller for SMPTE ST 2110 networks, written in
  Rust. It discovers NMOS Nodes on the local network and configures them, running
  either as a terminal UI (ratatui) or as a web server from the same binary. It is
  meant to replace a vendor controller appliance for operating a 2110 plant.

  Open source, Apache-2.0, mirrored publicly at github.com/st2110/jackfield.

  --- LANGUAGE ---
  Everything written into the repository is in English: code, comments,
  identifiers, documentation, commit messages, change artifacts, log and error
  strings, UI copy. The only exception is localization data. This holds even when
  the conversation with the user is in another language.

  --- STANDARDS (see AGENTS.md, symlinked as CLAUDE.md) ---
  Rust: async with tokio; invoke the `rust-skills` skill before writing or
  reviewing Rust. No panics in production code — `unwrap`, `expect`, `panic!`,
  `todo!` and fallible indexing are denied by workspace clippy lints outside
  tests, including in binary entry points; propagate with `?`. Errors: thiserror
  in libraries, anyhow in the binary.

  Tests come first: write the failing test before the code. The happy path is not
  coverage — exercise empty and maximum input, boundary values, malformed and
  hostile input, timeouts, disconnects, concurrency. Every bug gets a regression
  test that is red before the fix and is never weakened afterwards.

  Work on a ticket happens in a git worktree under `.agents/worktrees/`, on its
  own branch. Commit messages: at most three lines of description, ticket
  reference on the last line.

  Technical decisions that outlive a single change go to `docs/adr/`.

  --- GLOSSARY: NMOS RESOURCE MODEL (IS-04) ---
  Use the specification's meanings exactly. Do not use "device" loosely for "the
  box on the network" — that is a Node.

  **Node**: one logical host on the network, advertised over mDNS as
  `_nmos-node._tcp`. Holds Devices. _Not_: box, machine, unit.

  **Device**: a grouping within a Node that owns Senders and Receivers. A Node may
  host several. _Not_: node, endpoint.

  **Sender**: an egress from a Device — carries a Flow onto the network.

  **Receiver**: an ingress to a Device — consumes a stream from the network.
  Together with Senders, these are what an operator calls the box's outputs and
  inputs.

  **Flow**: the media a Sender carries (video raw or coded, audio, data, SDI
  ancillary data, mux). Originates from a Source.

  **Source**: the logical origin of a Flow.

  **Active state**: a Sender's or Receiver's current connection, read from IS-05
  `/single/{senders|receivers}/{id}/active`. Derived value: active, inactive, or
  unknown when the Connection API could not be read. Never report unknown as
  inactive.

  --- SPECIFICATIONS ---
  IS-04 Discovery and Registration (Node API), IS-05 Device Connection Management
  (Connection API). AMWA publishes these as RAML plus JSON Schema draft-04 — there
  is no official OpenAPI. Rust types are written by hand; the vendored schemas are
  used as validators in the test suite, in both directions (published examples
  must parse; our serialized output must validate). See
  docs/adr/0001-nmos-types-by-hand-schemas-as-validators.md.

  Discovery is peer-to-peer over mDNS with no registry, spoken in-process via
  `mdns-sd` — never by shelling out to `avahi-browse`.

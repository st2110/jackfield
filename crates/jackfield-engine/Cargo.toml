[package]
name = "jackfield-engine"
description = "Discovery and the in-memory inventory of NMOS Nodes"
version.workspace = true
edition.workspace = true
# This is the controller, not a library. Its public API is a screen and a set of
# keystrokes; the protocol is what got published, as `nmos`.
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nmos.workspace = true
mdns-sd.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
mdns-sd.workspace = true
serde_json.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
